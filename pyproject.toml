[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overheard"
version = "0.1.0"
description = "Local macOS meeting transcription with speaker diarization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
    "numpy>=1.24.0",
    "parakeet-mlx>=0.3.0",
    "scipy>=1.11.0",
]

# Diarization and ASR both run through bundled native code by default, so
# neither torch nor a Hugging Face account is needed for a working install.
# These extras exist for comparison and as fallbacks.
[project.optional-dependencies]
# The original CPU Whisper path, selectable via the "engine" config key.
whisper = ["whisperx>=3.1.0"]
# Fallback diarizer, selectable via the "diarizer" config key. Pulls in torch
# and needs HF_TOKEN for the gated pyannote model.
pyannote = ["pyannote.audio>=3.1.0", "torch>=2.0.0", "torchaudio>=2.0.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unit tests must stay hermetic and fast: no models, no helper binary, no
# network. Integration tests need the built helper and downloaded models, and
# skip themselves when those are absent so a fresh checkout still passes.
markers = [
    "integration: needs the built helper, downloaded models, or `say`",
]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["overheard"]
# AppKit view construction and Core Audio device setup need a real window server
# or real hardware. Including them only produces a misleading denominator; they
# are covered by the integration smoke tests and by running the app.
omit = [
    "*/app.py",
    "*/popover.py",
    "*/preferences.py",
    "*/details_panel.py",
    "*/transport.py",
    "*/live_panel.py",
    "*/cal.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[project.scripts]
overheard = "overheard.app:main"

[tool.setuptools.packages.find]
where = ["src"]
